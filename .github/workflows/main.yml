name: Prod build
run-name: Build release files 🚀
on: 
  push:
    branches:
      - 'main'
    paths:
      - '**.ps1'
      
jobs:
  build:
    name: Run build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer module
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe
      - name: Compile exe files
        shell: powershell
        run: |
          . ps2exe users.ps1 users.exe -requireAdmin
          . ps2exe anydesk.ps1 ad.exe -requireAdmin
          . ps2exe beautify.ps1 beautify.exe -requireAdmin
          . ps2exe revert.ps1 revert.exe -requireAdmin
      - name: Upload users.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: users-exe
          path: users.exe
      - name: Upload ad.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ad-exe
          path: ad.exe
      - name: Upload beautify.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: beautify-exe
          path: beautify.exe
      - name: Upload revert.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: revert-exe
          path: revert.exe

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate next version
        id: version
        run: |
          # Fetch all tags
          git fetch --tags
          
          # Get all tags matching v* pattern, sort them, and get the latest
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          
          # If no tags exist, default to v0.0.0
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          
          echo "Latest tag: $LATEST_TAG"
          
          # Remove 'v' prefix and split version into parts
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Increment patch version
          PATCH=$((PATCH + 1))
          
          # Construct new version
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          
          # Verify the tag doesn't already exist
          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "Warning: Tag $NEW_VERSION already exists, incrementing again..."
            PATCH=$((PATCH + 1))
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            echo "Adjusted new version: $NEW_VERSION"
          fi
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: users-exe
          path: .
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ad-exe
          path: .
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: beautify-exe
          path: .
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: revert-exe
          path: .
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "users.exe, ad.exe, beautify.exe, revert.exe"
          tag: ${{ steps.version.outputs.version }}
          # bodyFile: "body.md"
